"""How many things someone did on one day."""
type ActivityDay {
  count: Int!

  """YYYY-MM-DD in the requested time zone."""
  date: String!
}

"""What happened to a card in a CardActivity entry."""
enum ActivityKind {
  ARCHIVED
  ASSIGNEES
  CREATED
  DESCRIPTION
  DUE_DATE
  MOVED
  PRIORITY
  RENAMED
  RESTORED
  TAGS
}

"""A tag as it was when an activity entry was recorded."""
type ActivityTag {
  color: String!
  name: String!
}

type Board {
  """Archived cards on this board, most recently archived first."""
  archivedCards: [Card!]!

  """Archived lists on this board, most recently archived first."""
  archivedLists: [List!]!
  background: String!
  createdAt: String!

  """People added to this board directly who aren't in its workspace."""
  guests: [User!]!
  id: ID!

  """
  The later of the board's own last edit and the newest card activity on it.
  """
  lastActivityAt: String!
  lists: [List!]!

  """Everyone who can open the board: workspace members plus guests."""
  members: [User!]!
  owner: User!
  project: Project

  """Tags that cards on this board can carry, in the order they were added."""
  tags: [Tag!]!
  title: String!
  updatedAt: String!

  """Whether the viewer can delete the board and remove guests."""
  viewerCanManage: Boolean!
}

type Card {
  """What people did to the card, oldest first."""
  activity: [CardActivity!]!
  archived: Boolean!
  assignees: [User!]!
  board: Board!
  boardId: ID!

  """Comments on the card, oldest first."""
  comments: [Comment!]!
  createdAt: String!
  description: String!
  dueDate: String
  id: ID!
  list: List!
  listId: ID!
  position: String!

  """Null when none is set."""
  priority: Priority

  """The card's tags, in the board's tag order."""
  tags: [Tag!]!
  title: String!
}

"""Something someone did to a card."""
type CardActivity {
  actor: User

  """Tag names added (TAGS)."""
  added: [String!]!

  """Tags added (TAGS), with their colors at the time."""
  addedTags: [ActivityTag!]!

  """People assigned (ASSIGNEES)."""
  addedUsers: [User!]!
  createdAt: String!

  """
  Old value: list title (MOVED), card title (RENAMED), YYYY-MM-DD (DUE_DATE) or Priority value (PRIORITY). Null means none.
  """
  from: String
  id: ID!
  kind: ActivityKind!

  """Tag names removed (TAGS)."""
  removed: [String!]!

  """Tags removed (TAGS), with their colors at the time."""
  removedTags: [ActivityTag!]!

  """People unassigned (ASSIGNEES)."""
  removedUsers: [User!]!

  """New value, like `from`; also the list for CREATED and RESTORED."""
  to: String
}

"""How sortList orders a list's cards."""
enum CardSort {
  ADDED_NEWEST
  ADDED_OLDEST
  CREATED_NEWEST
  CREATED_OLDEST
  DUE_DATE
  FEWEST_ASSIGNEES
  MOST_COMMENTS
  PRIORITY
  TITLE
  UPDATED_NEWEST
  UPDATED_OLDEST
}

type Comment {
  author: User
  createdAt: String!

  """When the text was last edited; null if never."""
  editedAt: String
  id: ID!
  text: String!

  """Whether the viewer wrote it, and so can edit and delete it."""
  viewerIsAuthor: Boolean!
}

type CreateProjectPayload {
  project: Project!
  workspace: Workspace!
}

type DeleteCardPayload {
  board: Board!
  deletedId: ID!
  list: List!
}

type DeleteListPayload {
  board: Board!
  deletedId: ID!
}

type List {
  archived: Boolean!
  boardId: ID!
  cards: [Card!]!

  """Header color, a hex string such as #B3E5FC."""
  color: String!
  id: ID!
  position: String!
  title: String!
}

type MoveCardPayload {
  card: Card!
  fromList: List!
  toList: List!
}

type MoveCardsPayload {
  fromList: List!

  """How many cards moved."""
  moved: Int!
  toList: List!
}

type Mutation {
  addBoardMember(boardId: ID!, email: String!): Board!

  """Comment on an active card. Returns the card with its comments."""
  addComment(cardId: ID!, text: String!): Card!

  """Add someone who has signed in before. Any member can add people."""
  addWorkspaceMember(email: String!, workspaceId: ID!): Workspace!
  archiveCard(id: ID!): List!
  archiveList(id: ID!): Board!
  createBoard(background: String, projectId: ID!, title: String!): Board!

  """
  Add a card at the bottom of a list. The details are optional and checked like updateCard's.
  """
  createCard(assigneeIds: [ID!], description: String, dueDate: String, listId: ID!, priority: Priority, tagIds: [ID!], title: String!): List!

  """
  Add a list at the end of the board. Without `color` it gets the next default color for its place (the board's first list blue, the second green, and so on).
  """
  createList(boardId: ID!, color: String, title: String!): Board!
  createProject(name: String!, workspaceId: ID!): CreateProjectPayload!

  """Add a tag to the board's list of tags. Names are unique per board."""
  createTag(boardId: ID!, color: String!, name: String!): Board!

  """Create a workspace owned by the viewer, with one project to start in."""
  createWorkspace(name: String!): Workspace!
  deleteBoard(id: ID!): ID!

  """Permanently delete a card (active or archived). Can't be undone."""
  deleteCard(id: ID!): DeleteCardPayload!

  """
  Delete a comment you wrote. Returns its card with the remaining comments.
  """
  deleteComment(id: ID!): Card!

  """
  Permanently delete a list (active or archived) and every card in it, including archived ones. Can't be undone.
  """
  deleteList(id: ID!): DeleteListPayload!

  """
  Permanently delete a project with all its boards. Workspace owner only.
  """
  deleteProject(id: ID!): Workspace!

  """Remove a tag from the board and from every card that has it."""
  deleteTag(boardId: ID!, tagId: ID!): Board!

  """
  Permanently delete a workspace with all its projects, boards and cards.
  """
  deleteWorkspace(id: ID!): ID!

  """
  Move every active card in a list to the bottom of another list on the same board, keeping their order. Each card's activity records the move.
  """
  moveAllCards(fromListId: ID!, toListId: ID!): MoveCardsPayload!
  moveCard(afterId: ID, beforeId: ID, id: ID!, toListId: ID!): MoveCardPayload!
  moveList(afterId: ID, beforeId: ID, id: ID!): Board!
  removeBoardMember(boardId: ID!, userId: ID!): Board!

  """
  The owner can remove anyone else; any member can remove themselves (leave). Removed people lose access to the workspace's boards unless they're guests on one.
  """
  removeWorkspaceMember(userId: ID!, workspaceId: ID!): Workspace!
  renameList(id: ID!, title: String!): List!
  renameProject(id: ID!, name: String!): Project!
  renameWorkspace(id: ID!, name: String!): Workspace!

  """
  Un-archive a card, at the bottom of its original list or of `listId` if given. If the original list is archived too, `listId` is required.
  """
  restoreCard(id: ID!, listId: ID): RestoreCardPayload!

  """
  Un-archive a list, with the cards it had, at the end of the board's lists. Cards archived on their own stay archived.
  """
  restoreList(id: ID!): RestoreListPayload!

  """Choose where you land after signing in."""
  setStartPage(page: StartPage!): User!

  """
  Reorder a list's active cards once, for everyone. Cards can still be dragged afterwards. Not recorded in the cards' activity, like other reordering.
  """
  sortList(by: CardSort!, id: ID!): List!
  updateBoard(background: String, id: ID!, title: String): Board!
  updateCard(assigneeIds: [ID!], description: String, dueDate: String, id: ID!, priority: Priority, tagIds: [ID!], title: String): Card!

  """Change the text of a comment you wrote."""
  updateComment(id: ID!, text: String!): Comment!
  updateListColor(color: String!, id: ID!): List!
  updateTag(boardId: ID!, color: String, name: String, tagId: ID!): Board!
}

"""How urgent a card is, from HIGHEST to LOWEST."""
enum Priority {
  HIGH
  HIGHEST
  LOW
  LOWEST
  MEDIUM
}

type Project {
  """The project's boards, most recently updated first."""
  boards: [Board!]!
  createdAt: String!
  id: ID!
  name: String!
  workspace: Workspace!
}

type Query {
  """How many cards assignedCards would list without its limit."""
  assignedCardCount: Int!

  """
  Active cards assigned to the viewer on boards they can open (not in archived lists): due soonest first, then highest priority. At most 50.
  """
  assignedCards: [Card!]!
  board(id: ID!): Board

  """A card (active or archived), or null if the viewer can't open it."""
  card(id: ID!): Card
  me: User

  """
  How many things the viewer did (card activity and comments) on each of the last `days` days in `timeZone`, oldest first, including days with none.
  """
  myActivity(days: Int = 14, timeZone: String!): [ActivityDay!]!
  project(id: ID!): Project

  """
  Boards the viewer can open, most recently active first (card work or board edits).
  """
  recentBoards(limit: Int = 8): [Board!]!

  """Boards the viewer was invited to as a guest, outside their workspaces."""
  sharedBoards: [Board!]!
  workspace(id: ID!): Workspace

  """Workspaces the viewer belongs to, oldest first."""
  workspaces: [Workspace!]!
}

type RestoreCardPayload {
  board: Board!
  card: Card!
  list: List!
}

type RestoreListPayload {
  board: Board!
  list: List!
}

"""Where someone lands after signing in."""
enum StartPage {
  HOME
  LAST_WORKSPACE
}

type Tag {
  """Hex color; tags show white text on it."""
  color: String!
  id: ID!
  name: String!
}

type User {
  email: String!
  id: ID!
  image: String
  name: String

  """
  Where they land after signing in. Only for the viewer; null for others.
  """
  startPage: StartPage
}

type Workspace {
  createdAt: String!
  id: ID!
  members: [User!]!

  """Members with when they joined, in the same order as `members`."""
  memberships: [WorkspaceMember!]!
  name: String!
  owner: User!
  projects: [Project!]!
  viewerIsOwner: Boolean!
}

"""Someone in a workspace, and when they joined it."""
type WorkspaceMember {
  joinedAt: String!
  user: User!
}
